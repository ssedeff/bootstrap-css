<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Örnek çalışma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  </head>
  <body data-bs-theme="dark">

    <div class="container">
        <form action="kayit.html" method="post" class="row mt-3 was-validated" >
            <div class="col-12">
                <div class=" form-floating">
                    <input type="email" class="form-control " name="kposta" id="kposta" required placeholder="örek@gmail.com">
                    <label for="kposta" class="form-label ms-3">Epostanız:</label>
                    <div class="invalid-feedback">
                        Geçersiz eposta girdiniz :ooo ör;adı@gmail.com
                    </div>
                    <div class="valid-feedback">
                        Afferinnn doğru yazdın thank youuuu
                    </div>
                </div>
    

            </div>
           
            <div class=" form-floating col-12 mt-3">
                <input type="text" class="form-control" name="kad" id="kad" placeholder="Ad">
                <label for="kad" class="form-label ms-3">Adınız:</label>
            </div>

            <div class="col-12 mt-3"  >
                <!-- Checks buraya -->
                <div class=" form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" value="" id="secim1" name="secim1">
                    <label class="form-check-label" for="secim1">
                    Pastalar
                    </label>
                  </div>
                <div class=" form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" value="" id="secim2" name="secim2">
                    <label class="form-check-label" for="secim2">
                    İçecekler
                    </label>
                  </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" value="" id="secim3" name="secim3">
                    <label class="form-check-label" for="secim3">
                    Tatlılar
                    </label>
                  </div>
              
            </div>

            <div class="col-12 mt-3">
                 <!-- Checks buraya -->
                 <p>Dondurma çeşitleri</p>
                 <input type="checkbox" class="btn-check" id="dondurma1" checked autocomplete="off">
                 <label class="btn btn-outline-secondary" for="dondurma1">Karamel</label>

                 <input type="checkbox" class="btn-check" id="dondurma2" checked autocomplete="off">
                 <label class="btn btn-outline-secondary" for="dondurma2">Çilek</label>

                 <input type="checkbox" class="btn-check" id="dondurma3" checked autocomplete="off">
                 <label class="btn btn-outline-secondary" for="dondurma3">Çikolata</label>

                 <input type="checkbox" class="btn-check" id="dondurma4" checked autocomplete="off">
                 <label class="btn btn-outline-secondary" for="dondurma4">Muz</label>
                 
            </div>

            <div class="col-12 mt-3">
                <label for="ttur">Talep Türünü seçiniz:</label>
                <select name="ttur" class="form-select" id="ttur">
                    <option value="1">Şikayet</option>
                    <option value="2">Öneri</option>
                    <option value="3">Teşekkur</option>
                </select>
            </div>

            <div class="col-12 mt-3">
                <label for="kdusunce" class="form-label"></label>Düşünceniz:</label>
                <textarea name="kdusunce" id="kdusunce" class="form-control" rows="5"></textarea>

                <div class="col-12 mt-3"   >
                    <p>Ödeme türü   </p>
                    <div class="form-check">
                        <input class="form-check-input" required type="radio" name="odeme" value="1"  id="odeme1">
                        <label class="form-check-label" for="odeme1">
                        Banka kartı
                        </label>
                      </div>

                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="odeme" value="2" id="odeme2">
                        <label class="form-check-label" for="odeme2">
                       Kredi kartı
                        </label>
                      </div>

                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="odeme"  value="3" id="odeme3">
                        <label class="form-check-label" for="odeme3">
                        Nakit
                        </label>
                        <div class="invalid-feedback">
                            birini seççç
                        </div>
                      </div>
                     

                      <div class="col-12 mt-3">
                        <div class="input-group">
                            <input type="text" class="form-control" value="670">
                            <span class="input-group-text">₺</span>
                          </div>
                          
                      </div>
                </div>



                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-success">kaydet</button>
                </div>
                
            </div>
        </form>
    </div>
    













    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  </body>
</html>
